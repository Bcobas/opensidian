name: Windows build

on:
  push:
    branches: [develop, windows-port]
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust and Tauri CLI
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          $url = 'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-x86_64-pc-windows-msvc.zip'
          $expected = '0743e30a661a35d63339b24cf63828f97ba5389a1d7f13b368a542794dd0a3f3'
          $archive = Join-Path $env:RUNNER_TEMP tauri-cli.zip
          $directory = Join-Path $env:RUNNER_TEMP tauri-cli
          Invoke-WebRequest $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Tauri CLI checksum mismatch' }
          Expand-Archive $archive $directory
          $cli = Get-ChildItem $directory -Recurse -Filter cargo-tauri.exe | Select-Object -First 1
          if (!$cli) { throw 'Tauri CLI executable missing from archive' }
          $cli.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Test the vault backend
        working-directory: src-tauri
        run: cargo test --release --locked --target x86_64-pc-windows-msvc --lib
      - name: Test standalone editing and document conversion
        working-directory: src-tauri
        run: cargo test --release --locked --target x86_64-pc-windows-msvc --bin opensidian reader::tests
      - name: Test local history and note views
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --release --locked --target x86_64-pc-windows-msvc --bin opensidian history::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked --target x86_64-pc-windows-msvc --bin opensidian note_views::tests
      - name: Test portable packages and web capture
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --release --locked --target x86_64-pc-windows-msvc --bin opensidian portable::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked --target x86_64-pc-windows-msvc --bin opensidian web_clip::tests
      - name: Test Windows file actions
        working-directory: src-tauri
        run: cargo test --release --locked --target x86_64-pc-windows-msvc --bin opensidian file_actions::tests
      - name: Test graph clipboard bitmap
        working-directory: src-tauri
        run: cargo test --release --locked --target x86_64-pc-windows-msvc --bin opensidian windows::tests
      - name: Test Windows folder actions
        working-directory: src-tauri
        run: cargo test --release --locked --target x86_64-pc-windows-msvc --bin opensidian folder_actions::tests
      - name: Test Windows note merge
        working-directory: src-tauri
        run: cargo test --release --locked --target x86_64-pc-windows-msvc --bin opensidian note_merge::tests
      - name: Test folder-scoped search
        working-directory: src-tauri
        run: cargo test --release --locked --target x86_64-pc-windows-msvc --bin opensidian search_folder_scope_applies_before_the_result_limit
      - name: Test OCR on a scanned PDF
        working-directory: src-tauri
        shell: pwsh
        run: |
          choco install tesseract --version=5.5.3.20260724 --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) { throw "Tesseract install exited with $LASTEXITCODE" }
          $engine = Join-Path $env:ProgramFiles 'Tesseract-OCR\tesseract.exe'
          if (!(Test-Path -LiteralPath $engine)) { throw 'Tesseract executable not found' }
          $env:OPENSIDIAN_TESSERACT = $engine
          cargo test --release --locked --target x86_64-pc-windows-msvc --bin opensidian reader::tests::scanned_pdf_ocr -- --ignored
      - name: Build NSIS installer
        run: cargo tauri build --ci --target x86_64-pc-windows-msvc -- --locked
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Opensidian-Windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Start Opensidian on a test vault
        shell: pwsh
        run: |
          $vault = Join-Path $env:RUNNER_TEMP opensidian-smoke-vault
          New-Item -ItemType Directory -Path $vault | Out-Null
          Set-Content -LiteralPath (Join-Path $vault Smoke.md) -Value "# Smoke"
          $env:VAULT_DIR = $vault
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP opensidian-smoke-webview
          $stderr = Join-Path $env:RUNNER_TEMP opensidian-smoke-stderr.txt
          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/opensidian.exe"
          $app = Start-Process -FilePath $exe -WindowStyle Hidden -RedirectStandardError $stderr -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              if ($app.HasExited) { throw "Opensidian exited with status $($app.ExitCode)" }
              $pageServed = Select-String -LiteralPath $stderr -Pattern '^\[csp\] page trusted=false' -Quiet
              $vaultOpened = Test-Path -LiteralPath (Join-Path $vault '.obsidian/app.json')
              if ($pageServed -and $vaultOpened) { break }
              Start-Sleep -Milliseconds 300
            } while ((Get-Date) -lt $deadline)
            if (!$pageServed -or !$vaultOpened) { throw "The vault or application page did not load" }
          } catch {
            Get-Content -LiteralPath $stderr -Tail 20
            throw
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Test the installed document reader
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installer = Get-ChildItem -LiteralPath $bundle -Filter "*-setup.exe" -File | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP opensidian-reader-install
          $classes = "HKCU:\Software\Classes"
          $extensions = ".md", ".markdown", ".txt", ".pdf"
          $defaults = @{}
          foreach ($extension in $extensions) {
            $defaults[$extension] = (Get-Item -LiteralPath "$classes\$extension" -ErrorAction SilentlyContinue)?.GetValue("")
          }
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with status $($setup.ExitCode)" }
          $exe = Join-Path $installDir opensidian.exe
          $progId = "dev.koto.opensidian.Markdown"
          foreach ($extension in $extensions) {
            $registered = (Get-Item -LiteralPath "$classes\$extension\OpenWithProgids").GetValueNames()
            if ($registered -notcontains $progId) { throw "Missing Open with registration for $extension" }
            $defaultAfter = (Get-Item -LiteralPath "$classes\$extension").GetValue("")
            if ($defaults[$extension] -ne $defaultAfter) { throw "Installer changed the default app for $extension" }
          }
          $command = (Get-Item -LiteralPath "$classes\$progId\shell\open\command").GetValue("")
          if ($command -ne ('"{0}" "%1"' -f $exe)) { throw "Unexpected Markdown open command: $command" }

          $folder = Join-Path $env:RUNNER_TEMP "standalone notes"
          New-Item -ItemType Directory -Path $folder | Out-Null
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP opensidian-reader-webview
          $testFiles = "Notas de café.MD", "Texto de prueba.TXT", "Lectura de prueba.PDF"
          foreach ($name in $testFiles) {
            $document = Join-Path $folder $name
            $isPdf = $name.EndsWith(".PDF")
            if ($isPdf) {
              Copy-Item -LiteralPath 'src-tauri/tests/fixtures/reader/selectable.pdf' -Destination $document
            } else {
              Set-Content -LiteralPath $document -Value "# Reader smoke test"
            }
            $before = (Get-FileHash -LiteralPath $document).Hash
            $stderr = Join-Path $env:RUNNER_TEMP "$name.log"
            $arguments = @('"{0}"' -f $document)
            if ($isPdf) { $arguments += '--pdf-page=2' }
            $app = Start-Process -FilePath $exe -ArgumentList $arguments -WindowStyle Hidden -RedirectStandardError $stderr -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(45)
              do {
                if ($app.HasExited) { throw "Opensidian exited with status $($app.ExitCode)" }
                $loaded = Select-String -LiteralPath $stderr -Pattern '^\[reader\] opened standalone document' -Quiet
                $displayed = !$isPdf -or (Select-String -LiteralPath $stderr -Pattern '^\[reader\] rendered PDF page 2$' -Quiet)
                if ($loaded -and $displayed) { break }
                Start-Sleep -Milliseconds 300
              } while ((Get-Date) -lt $deadline)
              if (!$loaded -or !$displayed) { throw "The reader did not load $name" }
              if ((Get-FileHash -LiteralPath $document).Hash -ne $before) { throw "The reader modified $name on open" }
            } catch {
              Get-Content -LiteralPath $stderr -Tail 20
              throw
            } finally {
              if (!$app.HasExited) { Stop-Process -Id $app.Id }
            }
          }
          if ((Get-ChildItem -LiteralPath $folder -Force).Count -ne $testFiles.Count) {
            throw "Opening the documents created extra files or folders"
          }

          $contents = Join-Path $env:RUNNER_TEMP 'package source'
          New-Item -ItemType Directory -Path $contents | Out-Null
          Set-Content -LiteralPath (Join-Path $contents 'opensidian-package.json') -Value '{"version":1,"entry":"Start.md"}'
          Set-Content -LiteralPath (Join-Path $contents 'Start.md') -Value '# Portable package'
          $package = Join-Path $env:RUNNER_TEMP 'Portable notes.opensidian.zip'
          Compress-Archive -Path (Join-Path $contents '*') -DestinationPath $package
          $before = (Get-FileHash -LiteralPath $package).Hash
          $stderr = Join-Path $env:RUNNER_TEMP opensidian-package.log
          $app = Start-Process -FilePath $exe -ArgumentList ('"{0}"' -f $package) -WindowStyle Hidden -RedirectStandardError $stderr -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              if ($app.HasExited) { throw "Opensidian exited with status $($app.ExitCode)" }
              $loaded = Select-String -LiteralPath $stderr -Pattern '^\[package\] opened temporary vault$' -Quiet
              if ($loaded) { break }
              Start-Sleep -Milliseconds 300
            } while ((Get-Date) -lt $deadline)
            if (!$loaded) { throw 'The temporary package window did not load' }
            if ((Get-FileHash -LiteralPath $package).Hash -ne $before) { throw 'The archive was modified on open' }
          } catch {
            Get-Content -LiteralPath $stderr -Tail 20
            throw
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
