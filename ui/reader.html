<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Opensidian</title>
  <link rel="stylesheet" href="style.css">
  <script src="reader.js" defer></script>
</head>
<body class="standalone-reader">
  <header class="reader-toolbar" id="reader-toolbar" hidden>
    <label id="reader-pdf-selection" hidden>Pages to convert
      <input id="reader-ranges" type="text" maxlength="4096" placeholder="All pages" aria-describedby="reader-range-help" title="Enter pages or ranges, e.g. 1-3, 6. Leave blank for all pages.">
    </label>
    <span id="reader-range-help" hidden>Enter pages or ranges, e.g. 1-3, 6. Leave blank for all pages.</span>
    <div id="reader-ocr-options" hidden>
      <label><input id="reader-use-ocr" type="checkbox"> OCR scanned pages</label>
      <select id="reader-ocr-language" aria-label="OCR language" disabled>
        <option value="spanish">Español</option>
        <option value="english">English</option>
      </select>
    </div>
    <button id="reader-convert" hidden>Convert to Markdown</button>
    <button id="reader-edit" aria-pressed="false">Edit</button>
    <button id="reader-preview" aria-pressed="true">Preview</button>
    <button id="reader-save">Save</button>
    <button id="reader-copy" hidden>Save a Markdown copy</button>
    <button id="reader-reload" hidden>Reload from disk</button>
  </header>
  <div class="reader-workspace">
    <section id="reader-pdf" aria-label="Original PDF" hidden>
      <nav class="reader-pdf-nav" aria-label="PDF pages">
        <button id="reader-prev" aria-label="Previous page">‹</button>
        <label>Page <input id="reader-page-number" type="number" min="1" step="1"></label>
        <span id="reader-page-count"></span>
        <button id="reader-next" aria-label="Next page">›</button>
      </nav>
      <div class="reader-pdf-page" tabindex="0" aria-label="PDF page">
        <img id="reader-page-image" alt="">
        <p id="reader-page-error" role="status" hidden>Could not display this page.</p>
      </div>
    </section>
    <div id="reader-document-pane">
      <main id="document" class="preview" aria-label="Document preview" tabindex="0"></main>
      <textarea id="reader-source" aria-label="Document text" spellcheck="false" hidden></textarea>
    </div>
  </div>
  <p id="reader-status" role="status" hidden></p>
  <dialog id="reader-discard" aria-labelledby="reader-discard-title">
    <form method="dialog">
      <p id="reader-discard-title">Discard your unsaved changes?</p>
      <button value="cancel" autofocus>Keep editing</button>
      <button value="discard">Discard changes</button>
    </form>
  </dialog>
</body>
</html>
